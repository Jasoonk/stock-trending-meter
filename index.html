<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>美股儀表板</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c2230; --border: #2a323d;
    --text: #e6edf3; --text-dim: #9aa7b4; --text-faint: #6b7684;
    --accent: #58a6ff; --pos: #3fb950; --neg: #f85149; --warn: #d29922;
    --q1: #f85149; --q2: #f0883e; --q3: #3fb950; --q4: #58a6ff;
    --shadow: 0 8px 30px rgba(0,0,0,.35); --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #ffffff; --panel-2: #f1f4f8; --border: #d6dee6;
      --text: #1f2933; --text-dim: #57636f; --text-faint: #8a949e;
      --q3: #1f883d; --pos: #1f883d; --warn: #9a6700; --neg: #cf222e; --q1: #cf222e; --q2: #bc4c00; --q4: #0969da;
      --shadow: 0 6px 24px rgba(30,50,80,.10);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC",
      "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 16px 18px; }
  .num { font-variant-numeric: tabular-nums; }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .dim { color: var(--text-faint); }
  h2 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 2px 8px; flex-wrap: wrap; }
  h2 small { font-size: 11.5px; color: var(--text-faint); font-weight: 400; }

  header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  header.top h1 { font-size: 20px; margin: 0; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 12px; height: 12px; border-radius: 50%;
              background: linear-gradient(135deg, var(--q3), var(--q1)); }
  .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--text-dim); cursor: pointer;
                padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .seg button.active { background: var(--accent); color: #fff; }
  .btn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer;
         padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .subtitle { color: var(--text-faint); font-size: 12.5px; margin: 2px 0 18px; }

  /* 流動性釋放訊號（使用者標註的第 3 象限） */
  .signal { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; border-left: 5px solid var(--border); }
  .signal.on { border-left-color: var(--q3); }
  .signal.watch { border-left-color: var(--q2); }
  .sig-light { width: 54px; height: 54px; border-radius: 50%; flex: 0 0 54px; display: grid; place-items: center;
               font-size: 24px; background: var(--panel-2); border: 2px solid var(--border); }
  .signal.on .sig-light { background: rgba(63,185,80,.18); border-color: var(--q3); box-shadow: 0 0 18px rgba(63,185,80,.45); }
  .signal.watch .sig-light { background: rgba(240,136,62,.15); border-color: var(--q2); }
  .sig-title { font-size: 12px; color: var(--text-faint); }
  .sig-state { font-size: 22px; font-weight: 800; margin: 1px 0 2px; }
  .sig-desc { font-size: 12.5px; color: var(--text-dim); }
  .sig-side { margin-left: auto; text-align: right; font-size: 12px; color: var(--text-dim); min-width: 180px; }
  .sig-side b { color: var(--text); }

  .grid-2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } .signal { flex-wrap: wrap; } .sig-side { margin-left: 0; text-align: left; } }

  /* 目前象限 */
  .regime-name { font-size: 26px; font-weight: 800; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .regime-name .tag { font-size: 12px; font-weight: 600; color: var(--text-faint); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 20px; background: var(--panel-2); color: var(--text-dim); }
  .badge.ok { background: rgba(63,185,80,.14); color: var(--pos); }
  .badge.warn { background: rgba(240,136,62,.16); color: var(--q2); }
  .deltas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  @media (max-width: 520px) { .deltas { grid-template-columns: repeat(2, 1fr); } }
  .delta { background: var(--panel-2); border-radius: 9px; padding: 8px 10px; }
  .delta .l { font-size: 11px; color: var(--text-faint); }
  .delta .v { font-size: 17px; font-weight: 800; }
  .delta .s { font-size: 11px; color: var(--text-faint); }
  .prose { font-size: 13px; color: var(--text-dim); margin: 6px 0 0; }
  .prose b { color: var(--text); }

  /* 2x2 矩陣 */
  .matrix { display: grid; grid-template-columns: 26px 1fr 1fr; grid-template-rows: 22px 1fr 1fr; gap: 8px; }
  .mx-axis { font-size: 11px; color: var(--text-faint); display: flex; align-items: center; justify-content: center; text-align: center; }
  .mx-axis.v { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 1px; }
  .mx-cell { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 11px; min-height: 108px; position: relative; opacity: .62; }
  .mx-cell.cur { opacity: 1; box-shadow: 0 0 0 2px var(--cur), 0 6px 22px rgba(0,0,0,.25); border-color: var(--cur); }
  .mx-cell .qk { font-size: 11px; font-weight: 800; }
  .mx-cell .qn { font-size: 14px; font-weight: 800; margin: 1px 0 3px; }
  .mx-cell .qd { font-size: 11px; color: var(--text-dim); line-height: 1.45; }
  .mx-cell .star { position: absolute; top: 8px; right: 9px; font-size: 11px; }
  .mx-cell .here { position: absolute; bottom: 8px; right: 9px; font-size: 10.5px; font-weight: 800; }

  /* 圖表 */
  .charts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  @media (max-width: 960px) { .charts { grid-template-columns: 1fr; } }
  .chart-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .chart-head .t { font-size: 13px; font-weight: 700; }
  .chart-head .v { margin-left: auto; font-size: 15px; font-weight: 800; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-dim); margin-top: 4px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

  /* 象限時間軸 */
  .strip { display: flex; height: 26px; border-radius: 7px; overflow: hidden; margin: 6px 0 4px; }
  .strip span { flex: 1 1 0; min-width: 0; }
  .strip span.unclear { opacity: .35; }
  .strip-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-faint); }
  .strip-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-dim); margin-top: 8px; }
  .strip-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
  .note { font-size: 11.5px; color: var(--text-faint); margin-top: 8px; line-height: 1.6; }

  /* 劇本檢驗 */
  .fit-score { font-size: 30px; font-weight: 800; }
  .bars { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 112px 1fr 64px 40px; align-items: center; gap: 8px; font-size: 12px; }
  @media (max-width: 520px) { .bar-row { grid-template-columns: 88px 1fr 56px 30px; } }
  .bar-label b { font-size: 12.5px; } .bar-label small { display: block; font-size: 10.5px; color: var(--text-faint); }
  .bar-track { position: relative; height: 14px; background: var(--panel-2); border-radius: 4px; }
  .bar-track .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--text-faint); }
  .bar-track .med { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-dim); opacity: .7; }
  .bar-track .fill { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; }
  .exp { font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px; text-align: center; }
  .exp.up { background: rgba(63,185,80,.15); color: var(--pos); }
  .exp.down { background: rgba(248,81,73,.14); color: var(--neg); }

  /* 恐慌貪婪 */
  .fg { display: flex; gap: 18px; align-items: center; }
  .fg-gauge { width: 190px; flex: 0 0 190px; }
  .fg-body { flex: 1; min-width: 0; }
  .fg-stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; }
  .fg-stat .l { font-size: 11px; color: var(--text-faint); }
  .fg-stat .v { font-size: 15px; font-weight: 700; }
  @media (max-width: 520px) { .fg { flex-direction: column; align-items: stretch; } .fg-gauge { margin: 0 auto; } }

  /* AAII 散戶情緒 */
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .row { margin-bottom: 16px; }
  .aaii-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .aaii-grid { grid-template-columns: 1fr; } }
  .aaii-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .aaii-band { font-size: 22px; font-weight: 800; }
  .aaii-spread { font-size: 13px; color: var(--text-dim); }
  .stackbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 10px 0 8px; font-size: 11px; font-weight: 800; color: #fff; }
  .stackbar span { display: flex; align-items: center; justify-content: center; min-width: 0; white-space: nowrap; overflow: hidden; }
  .aaii-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
  .aaii-stats .delta .v { font-size: 16px; }
  .baserate { background: var(--panel-2); border-radius: 9px; padding: 9px 11px; font-size: 12.5px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; }
  .baserate b { color: var(--text); }

  /* 圖表 hover */
  .lc { position: relative; }
  .lc svg { display: block; touch-action: pan-y; }
  .lc-tip { position: absolute; top: 4px; pointer-events: none; display: none; z-index: 5;
            background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
            padding: 6px 9px; font-size: 11.5px; line-height: 1.55; white-space: nowrap; color: var(--text-dim); }
  .lc-tip .d { font-weight: 800; color: var(--text); margin-bottom: 1px; }
  .lc-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .lc-tip b { color: var(--text); }

  /* AAII 縮放 */
  .zoom-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 2px; }
  .seg.sm button { padding: 3px 9px; font-size: 11.5px; }
  .zoom-lbl { font-size: 11.5px; color: var(--text-faint); }
  #aaiiNav { margin-top: 4px; }
  #aaiiNav svg { display: block; touch-action: none; cursor: crosshair; user-select: none; }
  #aaiiNav .win { cursor: grab; }
  #aaiiNav .handle { cursor: ew-resize; }

  /* 資料來源異常 */
  .health { border-left: 5px solid var(--warn); margin-bottom: 16px; font-size: 13px; }
  .health .ht { font-weight: 800; color: var(--warn); }
  .health ul { margin: 4px 0 0; padding-left: 20px; color: var(--text-dim); }
  .health .hn { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }
  .src-ok { color: var(--pos); } .src-bad { color: var(--warn); font-weight: 700; }

  footer { color: var(--text-faint); font-size: 11.5px; margin-top: 22px; line-height: 1.8; }
  footer .warn { color: var(--q2); font-weight: 600; }
  code { font-size: 11px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .error { padding: 30px; text-align: center; color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="logo-dot"></span>美股儀表板</h1>
    <div class="controls">
      <div class="seg" id="lbSeg">
        <button data-lb="20">1 個月</button>
        <button data-lb="60" class="active">3 個月</button>
      </div>
      <button class="btn" id="refreshBtn">↻ 重新整理</button>
    </div>
  </header>
  <div class="subtitle" id="subtitle">美元指數 × 美債殖利率曲線 → 流動性象限 · 散戶情緒</div>

  <div id="app"><div class="error">載入中…</div></div>

  <footer>
    <div class="warn">⚠ 決策輔助，不是交易訊號。象限描述的是「過去 N 個交易日的方向」，不是預測。</div>
    <div id="provenance"></div>
  </footer>
</div>

<script>
/* 本頁只負責顯示。象限分類全部在 regime.py（單一真相），前端不重算，避免兩份實作漂移。 */
let D = null;
let LB = localStorageGet('lb') || '60';

function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

const QCOL = { Q1: 'var(--q1)', Q2: 'var(--q2)', Q3: 'var(--q3)', Q4: 'var(--q4)' };
const pct = (v, d = 1) => (v >= 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const sgn = (v, d = 0, u = '') => (v >= 0 ? '+' : '') + v.toFixed(d) + u;
const md = s => s ? s.slice(5).replace('-', '/') : '';
const ymd = s => s ? s.replace(/-/g, '/') : '';

async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
    render();
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="card error">讀不到 <code>data.json</code>（${e.message}）。<br>
       請先執行 <code>python fetch.py</code>，並用 http 開啟（雙擊 file:// 會被瀏覽器擋）。</div>`;
  }
}

/* ---------- 小型 SVG 折線圖（含 Y 軸與 X 軸刻度、滑鼠 hover 顯示日期與數值） ---------- */
const CH = {};          // 圖表 id → 座標資訊（給 hover 用）
let chartSeq = 0;
function lineChart(series, opt) {
  const w = opt.w || 380, h = opt.h || 170, pL = 38, pR = 8, pT = 10, pB = 22;
  const iw = w - pL - pR, ih = h - pT - pB;
  const all = series.flatMap(s => s.data).concat(opt.zero ? [0] : []);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const n = series[0].data.length;
  const x = i => pL + (i / (n - 1)) * iw;
  const y = v => pT + ih - ((v - lo) / (hi - lo)) * ih;
  const ticks = [hi - pad, (hi + lo) / 2, lo + pad];
  let svg = '';
  ticks.forEach(t => {
    svg += `<line x1="${pL}" x2="${w - pR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--border)" stroke-dasharray="2 4"/>`;
    svg += `<text x="${pL - 5}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-faint)">${opt.fmt(t)}</text>`;
  });
  if (opt.zero && lo < 0 && hi > 0) {
    svg += `<rect x="${pL}" y="${y(0).toFixed(1)}" width="${iw}" height="${(pT + ih - y(0)).toFixed(1)}" fill="var(--neg)" opacity=".07"/>`;
    svg += `<line x1="${pL}" x2="${w - pR}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--neg)" stroke-width="1" opacity=".6"/>`;
    svg += `<text x="${w - pR - 2}" y="${(y(0) + 11).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--neg)">倒掛區</text>`;
  }
  (opt.refs || []).forEach(r => {
    svg += `<line x1="${pL}" x2="${w - pR}" y1="${y(r.v).toFixed(1)}" y2="${y(r.v).toFixed(1)}" stroke="${r.color}" stroke-width="1" stroke-dasharray="5 4" opacity=".55"/>`;
  });
  if (opt.markFrom != null && opt.markFrom >= 0) {
    svg += `<rect x="${x(opt.markFrom).toFixed(1)}" y="${pT}" width="${(x(n - 1) - x(opt.markFrom)).toFixed(1)}" height="${ih}" fill="var(--accent)" opacity=".07"/>`;
  }
  series.forEach(s => {
    const d = s.data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/>`;
  });
  const dates = opt.dates || D.dates;
  [[0, 'start'], [Math.floor((n - 1) / 2), 'middle'], [n - 1, 'end']].forEach(([i, a]) => {
    svg += `<text x="${x(i).toFixed(1)}" y="${h - 6}" text-anchor="${a}" font-size="10" fill="var(--text-faint)">${(opt.xfmt || md)(dates[i])}</text>`;
  });
  svg += `<line class="xh" x1="0" x2="0" y1="${pT}" y2="${pT + ih}" stroke="var(--text-faint)" stroke-dasharray="3 3" visibility="hidden"/>`;
  series.forEach(s => { svg += `<circle class="xd" r="3.5" fill="${s.color}" stroke="var(--panel)" stroke-width="1.5" visibility="hidden"/>`; });
  const id = opt.id || 'c' + (++chartSeq);
  CH[id] = { w, n, pL, iw, x, y, dates, series, vfmt: opt.vfmt || opt.fmt, extra: opt.extra };
  return `<div class="lc" data-id="${id}"><svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">${svg}</svg><div class="lc-tip"></div></div>`;
}

function hideHover(wrap) {
  wrap.classList.remove('on');
  wrap.querySelectorAll('.xh,.xd').forEach(el => el.setAttribute('visibility', 'hidden'));
  wrap.querySelector('.lc-tip').style.display = 'none';
}
function chartHover(e) {
  const wrap = e.target.closest ? e.target.closest('.lc') : null;
  document.querySelectorAll('.lc.on').forEach(el => { if (el !== wrap) hideHover(el); });
  if (!wrap) return;
  const m = CH[wrap.dataset.id]; if (!m) return;
  const r = wrap.querySelector('svg').getBoundingClientRect();
  const sx = (e.clientX - r.left) / r.width * m.w;
  const i = Math.max(0, Math.min(m.n - 1, Math.round((sx - m.pL) / m.iw * (m.n - 1))));
  const X = m.x(i);
  wrap.classList.add('on');
  const xh = wrap.querySelector('.xh');
  xh.setAttribute('x1', X); xh.setAttribute('x2', X); xh.setAttribute('visibility', 'visible');
  wrap.querySelectorAll('.xd').forEach((c, k) => {
    c.setAttribute('cx', X); c.setAttribute('cy', m.y(m.series[k].data[i])); c.setAttribute('visibility', 'visible');
  });
  const tip = wrap.querySelector('.lc-tip');
  tip.innerHTML = `<div class="d">${ymd(m.dates[i])}</div>` +
    m.series.map(s => `<div><i style="background:${s.color}"></i>${s.name || ''} <b>${m.vfmt(s.data[i])}</b></div>`).join('') +
    (m.extra ? m.extra(i) : '');
  tip.style.display = 'block';
  const px = X / m.w * r.width;
  const left = px > r.width / 2 ? px - tip.offsetWidth - 12 : px + 12;
  tip.style.left = Math.max(0, left) + 'px';
}

/* ---------- 恐慌貪婪儀表 ---------- */
const RAT_ZH = { 'extreme fear': '極度恐慌', 'fear': '恐慌', 'neutral': '中性', 'greed': '貪婪', 'extreme greed': '極度貪婪' };
const fgCol = s => s < 25 ? '#f85149' : s < 45 ? '#f0883e' : s <= 55 ? '#d29922' : s <= 75 ? '#3fb950' : '#2ea043';
function gauge(score) {
  const cx = 120, cy = 122, r = 92, col = fgCol(score);
  const ang = v => 180 * (1 - v / 100);
  const P = (rr, d) => [cx + rr * Math.cos(d * Math.PI / 180), cy - rr * Math.sin(d * Math.PI / 180)];
  const arc = (a, b, c) => { const [x0, y0] = P(r, ang(a)), [x1, y1] = P(r, ang(b));
    return `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${c}" stroke-width="16"/>`; };
  const [nx, ny] = P(r - 22, ang(score));
  return `<svg viewBox="0 0 240 150" width="100%">

    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="var(--text)"/>
    <text x="${cx}" y="${cy - 26}" text-anchor="middle" font-size="36" font-weight="800" fill="${col}">${Math.round(score)}</text>
    <text x="16" y="146" font-size="11" fill="var(--text-faint)">0 恐慌</text>
    <text x="224" y="146" text-anchor="end" font-size="11" fill="var(--text-faint)">貪婪 100</text></svg>`;
}

/* ---------- AAII 散戶情緒 ---------- */
const BAND_COL = { '極度悲觀': 'var(--neg)', '偏悲觀': 'var(--q2)', '中性': 'var(--text-dim)', '偏樂觀': 'var(--q4)', '極度樂觀': 'var(--q4)' };
function aaiiBlock() {
  const a = D.aaii;
  if (!a) return '';
  const chg = (v, p, inv) => {
    const d = v - p; if (Math.abs(d) < 0.05) return '<span class="dim">持平</span>';
    return `<span class="${inv == null ? '' : (d > 0) !== inv ? 'pos' : 'neg'}">${d > 0 ? '▲' : '▼'}${Math.abs(d).toFixed(1)}</span>`;
  };
  const rank = a.pct < 50
    ? `只有 <b>${a.pct.toFixed(0)}%</b> 的週一樣悲觀或更悲觀`
    : `只有 <b>${(100 - a.pct).toFixed(0)}%</b> 的週比現在更樂觀`;
  const h = a.history;
  const br = a.base_rate;
  let brTxt = '';
  if (br) {
    const better = br.band.median - br.all.median, dpos = br.band.pos - br.all.pos;
    const verdict = Math.abs(dpos) < 0.05
      ? (Math.abs(better) < 0.01 ? '跟平常沒有明顯差別。' : `上漲機率跟平常差不多，差別主要在幅度（中位數${better > 0 ? '多' : '少'} ${Math.abs(better * 100).toFixed(1)} 個百分點）。`)
      : `上漲機率${dpos > 0 ? '高' : '低'}於平常 ${Math.abs(dpos * 100).toFixed(0)} 個百分點。`;
    brTxt = `<div class="baserate">📊 <b>歷史對照：</b>1987 年以來落在「${a.band}」區間的 <b>${br.band.n}</b> 週，S&P 500 之後 ${br.weeks} 週報酬中位數
      <b class="${br.band.median >= 0 ? 'pos' : 'neg'}">${pct(br.band.median)}</b>、上漲機率 <b>${(br.band.pos * 100).toFixed(0)}%</b>；
      全部週為 ${pct(br.all.median)}、${(br.all.pos * 100).toFixed(0)}%。${verdict}
      <div class="dim" style="font-size:11px;margin-top:3px">相鄰週的前瞻期間大幅重疊，實際獨立樣本遠少於 ${br.band.n}；只能當背景，不是勝率保證。</div></div>`;
  }
  return `<div class="card row">
    <h2>散戶情緒 <small>AAII 每週調查：「未來 6 個月股市會漲、持平、還是跌？」· ${ymd(a.date)}</small></h2>
    <div class="aaii-grid"><div>
    <div class="aaii-head">

      <span class="aaii-spread">看多−看空 <b class="num ${a.spread >= 0 ? 'pos' : 'neg'}">${sgn(a.spread, 1)}</b>（長期平均 ${sgn(a.avg.spread, 1)}）· 1987 年以來${rank}</span>
    </div>
    <div class="stackbar num">
      <span style="flex:${a.bull};background:var(--pos)">看多 ${a.bull}%</span>
      <span style="flex:${a.neutral};background:var(--text-faint)">中立 ${a.neutral}%</span>
      <span style="flex:${a.bear};background:var(--neg)">看空 ${a.bear}%</span>
    </div>
    <div class="aaii-stats num">
      <div class="delta"><div class="l">看多</div><div class="v pos">${a.bull}%</div><div class="s">長期 ${a.avg.bull}% · 週 ${chg(a.bull, a.prev.bull, false)}</div></div>
      <div class="delta"><div class="l">中立</div><div class="v">${a.neutral}%</div><div class="s">長期 ${a.avg.neutral}% · 週 ${chg(a.neutral, a.prev.neutral, null)}</div></div>
      <div class="delta"><div class="l">看空</div><div class="v neg">${a.bear}%</div><div class="s">長期 ${a.avg.bear}% · 週 ${chg(a.bear, a.prev.bear, true)}</div></div>
    </div>
    <div class="note" style="margin:2px 0 4px">${a.band_desc}${a.streak >= 2 ? ` 已連續 <b>${a.streak}</b> 週${a.spread < 0 ? '看空多於看多' : '看多多於看空'}。` : ''}</div>

    </div><div>
    <div class="zoom-bar" style="margin-top:0">
      <div class="seg sm" id="aaiiRange">${AAII_PRESETS.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join('')}</div>

      <span>下方時間線：拖曳選範圍 · 拖曳框框平移 · 拉兩側調寬窄 · 滾輪縮放</span></div>
    </div></div>

}

/* ---------- AAII 可縮放時間軸 ---------- */
const AAII_PRESETS = [[26, '6 個月'], [52, '1 年'], [104, '2 年'], [260, '5 年'], [0, '全部']];
const NAV = { w: 560, h: 50, pL: 6, pR: 6, pT: 4, pB: 14 };
const MIN_WIN = 8;                      // 最少顯示 8 週
let AV = null;                          // [起, 迄] 週索引（含）；null＝預設近兩年
let navDrag = null;

function aaiiView() {
  const N = D.aaii.history.dates.length;
  if (!AV) AV = [Math.max(0, N - 104), N - 1];
  return AV;
}
function setAaiiView(a, b) {
  const N = D.aaii.history.dates.length;
  const w = Math.round(Math.max(MIN_WIN - 1, Math.min(N - 1, b - a)));
  a = Math.round(a); b = a + w;
  if (a < 0) { a = 0; b = w; }
  if (b > N - 1) { b = N - 1; a = b - w; }
  AV = [a, b];
  drawAaii();
}
const navX = (i, N) => NAV.pL + (i / (N - 1)) * (NAV.w - NAV.pL - NAV.pR);
function navIdx(e, svg, N) {
  const r = svg.getBoundingClientRect();
  const sx = (e.clientX - r.left) / r.width * NAV.w;
  return Math.max(0, Math.min(N - 1, (sx - NAV.pL) / (NAV.w - NAV.pL - NAV.pR) * (N - 1)));
}
function aaiiNavSvg() {
  const h = D.aaii.history, N = h.dates.length, sp = h.spread;
  const lo = Math.min(...sp), hi = Math.max(...sp), ih = NAV.h - NAV.pT - NAV.pB;
  const y = v => NAV.pT + ih - (v - lo) / (hi - lo) * ih;
  const path = sp.map((v, i) => (i ? 'L' : 'M') + navX(i, N).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  let svg = `<rect x="${NAV.pL}" y="${NAV.pT}" width="${NAV.w - NAV.pL - NAV.pR}" height="${ih}" fill="var(--panel-2)" rx="3"/>`;
  svg += `<line x1="${NAV.pL}" x2="${NAV.w - NAV.pR}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--border)"/>`;
  svg += `<path d="${path}" fill="none" stroke="var(--text-faint)" stroke-width="0.8"/>`;
  let lastY = null;
  h.dates.forEach((d, i) => {
    const yr = +d.slice(0, 4);
    if (yr !== lastY && yr % 5 === 0) {
      svg += `<text x="${navX(i, N).toFixed(1)}" y="${NAV.h - 2}" text-anchor="middle" font-size="9" fill="var(--text-faint)">${yr}</text>`;
    }
    lastY = yr;
  });
  svg += `<rect class="win" y="${NAV.pT}" height="${ih}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="1.2" rx="2"/>`;
  svg += `<rect class="handle hl" y="${NAV.pT}" width="6" height="${ih}" fill="var(--accent)" rx="2"/>`;
  svg += `<rect class="handle hr" y="${NAV.pT}" width="6" height="${ih}" fill="var(--accent)" rx="2"/>`;
  return `<svg viewBox="0 0 ${NAV.w} ${NAV.h}" width="100%">${svg}</svg>`;
}
function drawAaii() {
  const el = document.getElementById('aaiiChart');
  if (!el) return;
  const a = D.aaii, h = a.history, N = h.dates.length, [s, e] = aaiiView();
  const sl = arr => arr.slice(s, e + 1);
  const span = e - s + 1;
  el.innerHTML = lineChart(
    [{ data: sl(h.bull), color: 'var(--pos)', name: '看多' }, { data: sl(h.bear), color: 'var(--neg)', name: '看空' }],
    { id: 'aaii', w: NAV.w, h: NAV.w > 400 ? 230 : 190, fmt: v => Math.round(v) + '%', vfmt: v => v.toFixed(1) + '%', dates: sl(h.dates),
      xfmt: span > 520 ? (d => d.slice(0, 4)) : (d => d.slice(0, 7).replace('-', '/')),
      refs: [{ v: a.avg.bull, color: 'var(--pos)' }, { v: a.avg.bear, color: 'var(--neg)' }],
      extra: i => { const v = h.spread[s + i]; return `<div>看多−看空 <b class="${v >= 0 ? 'pos' : 'neg'}">${sgn(v, 1)}</b></div>`; } });
  const svg = document.querySelector('#aaiiNav svg');
  const x0 = navX(s, N), x1 = navX(e, N);
  svg.querySelector('.win').setAttribute('x', x0.toFixed(1));
  svg.querySelector('.win').setAttribute('width', Math.max(1, x1 - x0).toFixed(1));
  svg.querySelector('.hl').setAttribute('x', (x0 - 3).toFixed(1));
  svg.querySelector('.hr').setAttribute('x', (x1 - 3).toFixed(1));
  document.getElementById('aaiiRangeLbl').textContent =
    `${ymd(h.dates[s]).slice(0, 7)} – ${ymd(h.dates[e]).slice(0, 7)}（${span} 週）`;
  document.querySelectorAll('#aaiiRange button').forEach(b => {
    const k = +b.dataset.k;
    b.classList.toggle('active', e === N - 1 && (k === 0 ? s === 0 : span === Math.min(k, N)));
  });
}
function navDown(e) {
  const svg = e.target.closest && e.target.closest('#aaiiNav svg');
  if (!svg || !D || !D.aaii) return;
  e.preventDefault();
  const N = D.aaii.history.dates.length, i = navIdx(e, svg, N), [s, t] = aaiiView();
  const r = svg.getBoundingClientRect(), pxPerIdx = r.width / NAV.w * (NAV.w - NAV.pL - NAV.pR) / (N - 1);
  const edge = 7 / pxPerIdx;           // 7 個螢幕像素內算抓到邊
  let mode = 'select';
  if (Math.abs(i - s) <= edge) mode = 'left';
  else if (Math.abs(i - t) <= edge) mode = 'right';
  else if (i > s && i < t) mode = 'pan';
  navDrag = { svg, N, mode, i0: i, s, t, moved: false };
  svg.setPointerCapture(e.pointerId);
}
function navMove(e) {
  if (!navDrag) return;
  const { svg, N, mode, i0, s, t } = navDrag, i = navIdx(e, svg, N);
  if (Math.abs(i - i0) > 0.5) navDrag.moved = true;
  if (!navDrag.moved) return;
  if (mode === 'pan') setAaiiView(s + (i - i0), t + (i - i0));
  else if (mode === 'left') setAaiiView(Math.min(i, t - MIN_WIN + 1), t);
  else if (mode === 'right') setAaiiView(s, Math.max(i, s + MIN_WIN - 1));
  else setAaiiView(Math.min(i0, i), Math.max(i0, i));
}
function navUp() {
  if (!navDrag) return;
  const { i0, s, t, moved, mode } = navDrag;
  navDrag = null;
  if (!moved && mode === 'select') {      // 點一下：把目前的視窗移到點的位置
    const w = t - s;
    setAaiiView(i0 - w / 2, i0 + w / 2);
  }
}
function navWheel(e) {
  const svg = e.target.closest && e.target.closest('#aaiiNav svg');
  if (!svg || !D || !D.aaii) return;
  e.preventDefault();
  const N = D.aaii.history.dates.length, i = navIdx(e, svg, N), [s, t] = aaiiView();
  const k = e.deltaY > 0 ? 1.25 : 0.8;   // 往下滾＝拉遠（看更長期間）
  setAaiiView(i - (i - s) * k, i + (t - i) * k);
}

  if (cur.q === 'Q3' && cur.clear) {

    <div class="strip">${cells}</div>
    <div class="strip-axis"><span>${ymd(D.dates[first])}</span><span>${ymd(D.dates[D.dates.length - 1])}</span></div>
    <div class="strip-legend">${['Q1', 'Q2', 'Q3', 'Q4'].map(k =>
      `<span><i style="background:${QCOL[k]}"></i>${k} ${D.quadrants[k].name} ${(cnt[k] / tot * 100).toFixed(0)}%</span>`).join('')}</div>
    ${eps.length ? `<div class="note">第 3 象限在此視角下出現 ${eps.length} 段${blips ? `，其中 <b>${blips} 段只維持 1–2 天</b>（雜訊）` : ''}。${LB === '20'
      ? '1 個月視角反應快但容易來回翻轉，建議以 3 個月視角確認。' : '3 個月視角較平滑，訊號較慢但較不易誤判。'}</div>` : ''}
  </div>`;
}

function fitBlock(cur) {
  const fit = cur.fit, q = D.quadrants[cur.q];
  if (!fit) return '';
  const rets = cur.returns;
  const syms = D.assets.filter(a => rets[a.symbol] != null).sort((a, b) => rets[b.symbol] - rets[a.symbol]);
  const maxAbs = Math.max(...syms.map(a => Math.abs(rets[a.symbol])), 0.01);
  const pos = v => 50 + (v / maxAbs) * 50;
  const exp = {}; q.up.forEach(s => exp[s] = 'up'); q.down.forEach(s => exp[s] = 'down');
  const hit = {}; fit.rows.forEach(r => hit[r.symbol] = r.hit);
  const rows = syms.map(a => {
    const v = rets[a.symbol], p = pos(v), e = exp[a.symbol];
    const l = Math.min(50, p), wd = Math.abs(p - 50);
    return `<div class="bar-row">
      <div class="bar-label"><b>${a.symbol}</b><small>${a.label}</small></div>
      <div class="bar-track"><div class="mid"></div><div class="med" style="left:${pos(fit.median).toFixed(1)}%"></div>
        <div class="fill" style="left:${l.toFixed(1)}%;width:${wd.toFixed(1)}%;background:${v >= 0 ? 'var(--pos)' : 'var(--neg)'};opacity:${e ? 1 : .35}"></div></div>
      <div class="num ${v >= 0 ? 'pos' : 'neg'}" style="text-align:right;font-weight:700">${pct(v)}</div>
      <div>${e ? `<span class="exp ${e}" title="${hit[a.symbol] ? '符合預期' : '不符預期'}">${e === 'up' ? '強' : '弱'}${hit[a.symbol] ? '✓' : '✗'}</span>` : ''}</div>
    </div>`;
  }).join('');
  const ratio = fit.hits / fit.total;
  const verdict = ratio >= 0.8 ? '市場正照這個象限的劇本走' : ratio >= 0.5 ? '部分符合，劇本只有局部有效' : '市場並未照劇本走，此象限的資產含義目前不可靠';
  return `<div class="card">
    <h2>劇本檢驗 <small>這個象限預期的資產表現，有沒有真的發生？</small></h2>
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <span class="fit-score num" style="color:${ratio >= 0.8 ? 'var(--pos)' : ratio >= 0.5 ? 'var(--q2)' : 'var(--neg)'}">${fit.hits}/${fit.total}</span>
      <span style="font-size:13px;color:var(--text-dim)">${verdict}</span>
    </div>
    <div class="note" style="margin-top:2px">同期報酬（${ymd(cur.ref_date)} 起）。預期「強」的資產應高於全體中位數（${pct(fit.median)}，灰色刻線），預期「弱」的應低於。淡色長條＝此象限沒有特別預期的資產。</div>
    <div class="bars">${rows}</div>
  </div>`;
}

function fgBlock() {
  const fg = D.market && D.market.fear_greed;
  if (!fg) return '';
  const st = (l, v) => v == null ? '' : `<div class="fg-stat"><div class="l">${l}</div><div class="v num">${Math.round(v)}
    <small class="${fg.score - v >= 0 ? 'pos' : 'neg'}">${fg.score - v >= 0 ? '▲' : '▼'}${Math.abs(fg.score - v).toFixed(0)}</small></div></div>`;
  return `<div class="card row">
    <h2>市場情緒 <small>CNN 恐慌貪婪指數（與流動性象限互相參照）</small></h2>
    <div class="fg"><div class="fg-gauge">${gauge(fg.score)}</div>
      <div class="fg-body">
        <div style="font-size:18px;font-weight:800;color:${fgCol(fg.score)}">${RAT_ZH[fg.rating] || fg.rating}</div>
        <div class="fg-stats">${st('前收', fg.previous_close)}${st('上週', fg.previous_1_week)}${st('上月', fg.previous_1_month)}${st('去年', fg.previous_1_year)}</div>
      </div></div>
  </div>`;
}

function render() {
  const cur = D.current[LB];
  document.querySelectorAll('#lbSeg button').forEach(b => b.classList.toggle('active', b.dataset.lb === LB));
  document.getElementById('subtitle').innerHTML =
    `美元指數 × 美債殖利率曲線 → 流動性象限 · 散戶情緒 · 資料至 <b>${ymd(D.dates[D.dates.length - 1])}</b> · 更新於 ${new Date(D.generated_at).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}`;
  NAV.w = window.innerWidth < 600 ? 380 : 560;   // 手機用窄比例，字才不會縮太小
  document.getElementById('app').innerHTML =
    healthBlock() + fgBlock() + aaiiBlock() + signalBlock(cur) +
    `<div class="grid-2">${regimeCard(cur)}${matrixCard(cur)}</div>` +
    chartsBlock() + stripBlock() +
    `<div class="row">${fitBlock(cur)}</div>`;
  drawAaii();
  document.getElementById('provenance').innerHTML =
    (D.health ? `<div>資料來源狀態：${D.health.map(h =>
      `<span class="${h.ok ? 'src-ok' : 'src-bad'}">${h.ok ? '✓' : '⚠'}</span> ${h.label} ${h.latest ? md(h.latest) : '—'}`).join(' · ')}</div>` : '') +
    `資料來源：2Y／10Y＝${D.sources.yields}；DXY＝${D.sources.dxy}；驗證資產＝${D.sources.assets}；情緒＝${D.sources.sentiment}、${D.sources.aaii || 'AAII'}（S&P 500＝${D.sources.spx || 'Yahoo'}）。` +
    `象限由 <code>regime.py</code> 計算（參數版本 <code>${D.param_version}</code>，死區：1 個月 DXY ±${D.params.LOOKBACKS['20'].dxy_pct}%／利差 ±${D.params.LOOKBACKS['20'].spread_bp}bp；3 個月 ±${D.params.LOOKBACKS['60'].dxy_pct}%／±${D.params.LOOKBACKS['60'].spread_bp}bp）。`;
}

document.getElementById('lbSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !D) return;
  LB = b.dataset.lb; localStorageSet('lb', LB); render();
});
document.getElementById('refreshBtn').addEventListener('click', load);
let resizeT = null, lastNarrow = window.innerWidth < 600;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const narrow = window.innerWidth < 600;
    if (D && narrow !== lastNarrow) { lastNarrow = narrow; render(); }
  }, 150);
});
document.addEventListener('pointermove', e => { navMove(e); if (!navDrag) chartHover(e); });
document.addEventListener('pointerdown', e => { chartHover(e); navDown(e); });
document.addEventListener('pointerup', navUp);
document.addEventListener('pointercancel', () => { navDrag = null; });
document.addEventListener('wheel', navWheel, { passive: false });
document.addEventListener('click', e => {
  const b = e.target.closest('#aaiiRange button'); if (!b || !D || !D.aaii) return;
  const N = D.aaii.history.dates.length, k = +b.dataset.k;
  setAaiiView(k ? N - Math.min(k, N) : 0, N - 1);
});
load();
</script>
</body>
</html>
